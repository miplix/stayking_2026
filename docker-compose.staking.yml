services:
  staking:
    build: .
    image: staking:latest
    container_name: staking
    restart: always
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks: [default, selfhost_internal]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/staking').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  selfhost_internal:
    external: true
